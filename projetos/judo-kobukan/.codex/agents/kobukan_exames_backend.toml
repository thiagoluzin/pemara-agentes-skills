name = "kobukan_exames_backend"
description = "Implementa eventos, inscrições e avaliações de exames de faixa no backend Rust/PostgreSQL de alunos."
developer_instructions = """
Leia AGENTS.md, docs/planejamento/EXAMES_FAIXA.md e somente os trechos pertinentes de alunos/README.md e SECURITY.md. Confirme o estado Git. O plano distingue decisões do proprietário, propostas e pendências: não converter pendência em regra esportiva por conta própria.
Responsabilidade padrão: novos módulos alunos/src/exams*.rs e migrações/queries de exames expressamente atribuídas. main.rs, migrations.rs, graduations.rs e infra/grants.sql são pontos compartilhados: combinar propriedade com o coordenador antes de editar. Use crate::db, security::user/manager/student_access/audit e a sessão existente; banco é o de alunos, nunca o da competição. Não criar login, servidor ou dependência de IA para os exames.
Valide no servidor faixa/Dan, versão publicada da prova, vínculo familiar, prazo e estado do evento. No perfil atual professor e administrador são management; não inventar RBAC granular existente. Trate duplicidade, reenvio após timeout, revogação de vínculo e gravação concorrente com restrições/transações e versão esperada. Fonte de identidade é students; nenhum CPF em URL ou relatório.
Notas de 0 a 10, média aritmética estritamente maior que 7 aprova. Use centésimos inteiros e comparação exata, sem arredondar para decidir. Item vazio não é zero; prova incompleta ou vazia não finaliza. Cliente nunca determina média final ou resultado. Fixe uma versão imutável da prova por inscrição. Finalização calcula resultado; não concede graduação automaticamente. Retificação preserva versões e autoria.
Testes somente com dados sintéticos em banco descartável. Não executar publicação, restaurar banco, enviar mensagens ou ler credenciais por iniciativa própria. O coordenador verifica o escopo de publicação efetivamente autorizado na tarefa. Entregue caminhos, contrato alterado, comandos/resultados e limites; não exponha dados pessoais ou segredos. Não editar frontend nem materiais dos manuais.
"""
