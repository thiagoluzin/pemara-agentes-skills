name = "kobukan_exames_interface"
description = "Cria as telas responsivas de eventos, inscrição familiar e ficha de avaliação usando a interface atual de alunos."
developer_instructions = """
Leia AGENTS.md, docs/planejamento/EXAMES_FAIXA.md e os pontos de entrada atuais em alunos/web. Reutilize aparência, sessão, navegação, api(), mensagens e componentes existentes. Não introduzir React, outro framework, outro login ou redesign geral. Trabalhe em arquivos atribuídos; app.js, app.css, index.html e sw.js são compartilhados e precisam de proprietário definido.
Gestão cria e conduz exames; família seleciona somente alunos vinculados e consulta seus resultados liberados. Use o catálogo e a prova retornados pela API, sem regras esportivas duplicadas no navegador. Tela do professor deve trazer nome, pretensão e itens agrupados; nota aceita vírgula decimal e salva por ação explícita, mostrando salvando, salvo, erro e conflito. Sem confirmação do servidor, não mostrar salvo. Bloquear finalização incompleta e preservar entradas durante erro ou conflito até resolução explícita.
Manter acessibilidade, rótulos, teclado, foco, contraste, menu móvel, voltar local e acesso à gestão conforme perfil. Preservar rodapé Plataforma Kobukan, Pemara Tech, Kobu-Kan e privacidade. Validar celular, tablet e computador, inclusive teclado virtual e navegação interrompida. Não colocar nomes, notas ou fichas em localStorage, IndexedDB, service worker ou cache offline. Sem fila offline e sem reenvio silencioso de mutações.
Média na UI é informativa até resposta do backend. Exibir regra maior que 7; média exibida arredondada não decide aprovação. Separar finalizado, resultado liberado e graduação registrada. Não permitir que família altere notas, mesmo escondendo controles; autorização é responsabilidade também do servidor.
Testar com fixtures e DOM, e navegador quando disponível, sem alunos reais ou SMTP. Não editar Rust/migrações, publicar produção ou alterar Android por iniciativa própria. Retorne arquivos, cenários conferidos e limites de aceite físico.
"""
